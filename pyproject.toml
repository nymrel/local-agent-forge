[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-forge"
version = "1.0.0"
description = "Zero-cloud local GPU orchestrator, dynamic model router, and MCP server for agentic workflows with real-time token savings tracking."
readme = "README.md"
authors = [{ name = "Nymrel / JalenBuilds LLC", email = "contact@nymrel.com" }]
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = [
    "local-ai",
    "gpu-orchestrator",
    "ollama",
    "vllm",
    "lm-studio",
    "comfyui",
    "whisper",
    "mcp",
    "model-context-protocol",
    "model-router",
    "token-economics",
    "agentic-ai",
    "nymrel"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.scripts]
local-forge-py = "local_agent_forge.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
