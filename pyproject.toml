[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "local-agent-forge"
version = "1.0.0"
description = "Pre-release local inference adapters, heuristic routing, and MCP tools for agent workflows"
readme = "README.md"
authors = [{ name = "Nymrel / JalenBuilds LLC", email = "contact@nymrel.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
keywords = [
    "local-ai",
    "gpu-orchestrator",
    "ollama",
    "vllm",
    "lm-studio",
    "comfyui",
    "whisper",
    "mcp",
    "model-context-protocol",
    "model-router",
    "token-economics",
    "agentic-ai",
    "nymrel"
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
"Homepage" = "https://github.com/nymrel/local-agent-forge"
"Repository" = "https://github.com/nymrel/local-agent-forge"
"Bug Tracker" = "https://github.com/nymrel/local-agent-forge/issues"
"Changelog" = "https://github.com/nymrel/local-agent-forge/blob/main/CHANGELOG.md"
"Security" = "https://github.com/nymrel/local-agent-forge/blob/main/SECURITY.md"

[project.scripts]
local-forge-py = "local_agent_forge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["python/local_agent_forge"]

[tool.hatch.build.targets.sdist]
include = [
    "python/local_agent_forge",
    "tests",
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
    "RELEASE_READINESS.md",
    "SECURITY.md",
    "pyproject.toml",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
